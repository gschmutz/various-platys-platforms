  #  ================================== Jupyter ========================================== #
  jupyter:
    image: quay.io/jupyter/all-spark-notebook:spark-4.1.1
    container_name: jupyter
    hostname: jupyter
    labels:
      com.platys.name: jupyter
      com.platys.description: Web-based interactive development environment for notebooks, code, and data
      com.platys.webui.title: Jupyter UI
      com.platys.webui.url: http://dataplatform:38888
      com.platys.password.envvars: PLATYS_JUPYTER_TOKEN,PLATYS_AWS_SECRET_ACCESS_KEY
    ports:
      - 38888:8888
      - 28376-28380:4040-4044
    user: root
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      JUPYTER_ENABLE_LAB: "'yes'"
      GRANT_SUDO: "'yes'"
      JUPYTER_TOKEN: ${PLATYS_JUPYTER_TOKEN:-abc123!}
      DOCKER_STACKS_JUPYTER_CMD: lab
      MAVEN_DOWNLOAD_REPO: central
      MAVEN_DOWNLOAD_REPO_NEXUS: http://nexus:8081/repository/maven-public
      MAVEN_DOWNLOAD_REPO_NEXUS_USER: admin
      MAVEN_DOWNLOAD_REPO_NEXUS_PASSWORD: ${PLATYS_NEXUS_ADMIN_PASSWORD:-abc123!abc123!}
      MAVEN_DOWNLOAD_JARS: software.amazon.awssdk:bundle:2.35.4,org.apache.hadoop:hadoop-aws:3.4.2
      # remove some JARS if they are conflicting with the ones installed above
      REMOVE_JARS: guava-14.0.1.jar
      # for awscli & s3cmd
      AWS_ACCESS_KEY_ID: ${PLATYS_AWS_ACCESS_KEY:-admin}
      AWS_SECRET_ACCESS_KEY: ${PLATYS_AWS_SECRET_ACCESS_KEY:-${PLATYS_AWS_SECRET_ACCESS_KEY:-abc123abc123!}}
      AWS_ENDPOINT: http://rustfs-1:9000
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      #PYSPARK_PYTHON: /opt/bitnami/python/bin/python3.12
      #PYSPARK_DRIVER_PYTHON: /usr/bin/python3.12   
    volumes:
      - ./data-transfer:/data-transfer:z
      - ./init/jupyter/on-startup-jupyter/:/usr/local/bin/start-notebook.d/:z
      - ./init/jupyter/on-startup-jupyter-finished/:/usr/local/bin/before-notebook.d/:z
      - ./init/jupyter/on-startup-notebook-kernel:/home/jovyan/.ipython/profile_default/startup/:z
      - ./scripts/docker/maven-download.sh:/maven-download.sh:z
#      - spark-4-1-1-python3-vol:/opt/spark:RO
    command:
      # In the command section, $ are replaced with $$ to avoid the error 'Invalid interpolation format for "command" option'
      - bash
      - -c
      - |
        conda create -y --name py310 python=3.10.12
        source /opt/conda/etc/profile.d/conda.sh
        conda activate py310
        pip install ipykernel
        python -m ipykernel install --user --name py310 --display-name "Python 3.10.12 (ipykernel)"
        conda run -n py310 pip install pyspark==4.1.1 numpy graphframes-py typing_extensions jupysql "zstandard>=0.25.0" pandas arrow pyarrow grpcio-status boto3
        start-notebook.sh
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:8888/api]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
