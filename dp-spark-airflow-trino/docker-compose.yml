    ports:
      - 9005:9000   # S3 API port
      - 9014:9010   # Console port    
    environment:
      - RUSTFS_VOLUMES=/data/rustfs{0..3} # Define 4 storage volumes
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9010
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=${PLATYS_AWS_ACCESS_KEY:-admin}
      - RUSTFS_SECRET_KEY=${PLATYS_AWS_SECRET_ACCESS_KEY:-abc123abc123!}
      - RUSTFS_OBS_LOGGER_LEVEL=info
      # Keep strict disk topology checks enabled by default.
      # For local testing only, set `RUSTFS_UNSAFE_BYPASS_DISK_CHECK=true` explicitly.      
      - RUSTFS_UNSAFE_BYPASS_DISK_CHECK=true
#      - RUSTFS_TLS_PATH=/opt/tls
    volumes:
      - ./data-transfer:/data-transfer:z
    restart: unless-stopped
    healthcheck:
      test: [CMD, sh, -c, curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9010/rustfs/console/health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  #  ================================== RustFS MC ========================================== #
  rustfs-mc:
    image: quay.io/minio/mc:latest
    container_name: rustfs-mc
    hostname: rustfs-mc
    labels:
      com.platys.name: rustfs
      com.platys.description: RustFS CLI
    environment:
      # these two env variables are also needed for the s3-credentials.properties file gen to work! 
      AWS_ACCESS_KEY: ${PLATYS_AWS_ACCESS_KEY:-admin}
      AWS_SECRET_ACCESS_KEY: ${PLATYS_AWS_SECRET_ACCESS_KEY:-abc123abc123!}
      MC_HOST_rustfs-1: http://${PLATYS_AWS_ACCESS_KEY:-admin}:${PLATYS_AWS_SECRET_ACCESS_KEY:-abc123abc123!}@rustfs-1:9000
    volumes:
      - ./data-transfer:/data-transfer:z
      - ./scripts/docker/wait-for-it.sh:/usr/src/app/wait-for-it.sh:z
    entrypoint:
      - /bin/sh
      - -c
      - |
        /usr/src/app/wait-for-it.sh -t 180 rustfs-1:9000
        mc mb --ignore-existing rustfs-1/admin-bucket
              for bucket in $$(tr ',' '\n' <<< "")
        do
          mc mb --ignore-existing rustfs-1/$$bucket
        done
        #
        while [ 1 -eq 1 ];do sleep 60;done
    restart: unless-stopped
  #  ================================== Awscli ========================================== #
  awscli:
    image: docker.io/trivadis/awscli-s3cmd:latest
    container_name: awscli
    hostname: awscli
    labels:
      com.platys.name: awscli
      com.platys.description: AWS CLI
    environment:
      AWS_ACCESS_KEY_ID: ${PLATYS_AWS_ACCESS_KEY:-admin}
      AWS_SECRET_ACCESS_KEY: ${PLATYS_AWS_SECRET_ACCESS_KEY:-${PLATYS_AWS_SECRET_ACCESS_KEY:-abc123abc123!}}
      AWS_ENDPOINT: rustfs-1:9000
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./data-transfer:/data-transfer:z
      - ./conf/awscli/s3cfg.template:/root/.s3cfg.template:z
    command: tail -f /dev/null
    restart: unless-stopped
  #  ================================== Polaris ========================================== #
  polaris:
    image: docker.io/apache/polaris:latest
    container_name: polaris
    hostname: polaris
    labels:
      com.platys.name: polaris
      com.platys.description: Secure, fast and easy to use Iceberg REST Catalog
      com.platys.restapi.title: Polaris Web UI
      com.platys.restapi.url: http://dataplatform:8181/api/management/v1/catalogs
      com.platys.password.envvars: PLATYS_POLARIS_DB_PASSWORD,PLATYS_POLARIS_CLIENT_SECRET
    ports:
      - 8181:8181
      - 8182:8182
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${PLATYS_AWS_ACCESS_KEY:-admin}
      AWS_SECRET_ACCESS_KEY: ${PLATYS_AWS_SECRET_ACCESS_KEY:-abc123abc123!}
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL_S3: http://rustfs-1:9000
      AWS_ENDPOINT_URL_STS: http://rustfs-1:9000
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: 5
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_INITIAL_DELAY_IN_MS: 100
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_DURATION_IN_MS: 5000
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgresql:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: ${PLATYS_POLARIS_DB_PASSWORD:-abc123!}
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,admin,${PLATYS_POLARIS_CLIENT_SECRET:-abc123!}
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      QUARKUS_OTEL_SDK_DISABLED: true
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": 'true'
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": '["FILE","S3","GCS","AZURE"]'
      polaris.readiness.ignore-severe-issues: 'true'
      QUARKUS_HTTP_CORS_ENABLED: true
      QUARKUS_HTTP_CORS_ORIGINS: http://${PUBLIC_IP}:28494
      QUARKUS_HTTP_CORS_METHODS: GET,POST,PUT,DELETE,PATCH,OPTIONS
      QUARKUS_HTTP_CORS_HEADERS: Content-Type,Authorization,Polaris-Realm,X-Request-ID
      QUARKUS_HTTP_CORS_EXPOSED_HEADERS: '*'
      QUARKUS_HTTP_CORS_ACCESS_CONTROL_ALLOW_CREDENTIALS: true
      QUARKUS_HTTP_CORS_ACCESS_CONTROL_MAX_AGE: PT10M
    volumes:
      - ./data-transfer:/data-transfer:z
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8182/q/health]
      interval: 10s
      timeout: 5s
      retries: 15
  polaris-db-setup:
    image: docker.io/apache/polaris-admin-tool:latest
    container_name: polaris-db-setup
    hostname: polaris-db-setup
    labels:
      com.platys.name: polaris
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgresql:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: ${PLATYS_POLARIS_DB_PASSWORD:-abc123!}
    volumes:
      - ./data-transfer:/data-transfer:z
    command:
      - bootstrap
      - --realm=POLARIS
      - --credential=POLARIS,admin,${PLATYS_POLARIS_CLIENT_SECRET:-abc123!}
    init: true
    restart: no
  polaris-catalog-setup:
    image: docker.io/alpine/curl
    container_name: polaris-catalog-setup
    hostname: polaris-catalog-setup
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      - CLIENT_ID=admin
      - CLIENT_SECRET=${PLATYS_POLARIS_CLIENT_SECRET:-abc123!}
      - S3_ENDPOINT=http://rustfs-1:9000
      - DEFAULT_STORAGE_LOCATION=s3a://admin-bucket
      - ALLOWED_STORAGE_LOCATIONS=s3a://admin-bucket,s3a://iceberg-bucket
      - NAMESPACE=default
      - NAMESPACE_STORAGE_LOCATION=s3a://admin-bucket
      - CATALOG_NAME=polaris_catalog
      - REALM=POLARIS
    volumes:
      - ./init/polaris/:/polaris:z
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        source /polaris/obtain-token.sh &&
        echo Creating catalog... &&
        ALLOWED_LOCS=$$([ -n "$$ALLOWED_STORAGE_LOCATIONS" ] && echo "$$ALLOWED_STORAGE_LOCATIONS" | sed 's/,/","/g; s/^/"/; s/$/"/' || echo "\"$$DEFAULT_STORAGE_LOCATION\"") &&
        export STORAGE_CONFIG_INFO='{"storageType":"S3",
          "endpoint":"'$$S3_ENDPOINT'",
          "endpointInternal":"'$$S3_ENDPOINT'",
          "allowedLocations":['$$ALLOWED_LOCS'],
          "pathStyleAccess":true,
          "region":"us-east-1"}' &&
        export DEFAULT_STORAGE_LOCATION='s3a://admin-bucket' &&
        export CATALOG_NAME='polaris_catalog' &&
        export NAMESPACE=default &&
        export NAMESPACE_STORAGE_LOCATION=s3a://admin-bucket &&
        /polaris/create-catalog.sh POLARIS $$TOKEN &&
        echo Extra grants... &&
        curl \
          --fail-with-body \
          -H "Authorization: Bearer $$TOKEN" \
          -H 'Content-Type: application/json' \
          -X PUT \
          http://polaris:8181/api/management/v1/catalogs/polaris_catalog/catalog-roles/catalog_admin/grants \
          -d '{"type":"catalog", "privilege":"CATALOG_MANAGE_CONTENT"}' &&
        echo Done. &&
        echo ""
        echo "=========================================="
        echo "🎉 Polaris Setup Complete!"
        echo "=========================================="
        echo ""
        echo "Catalog: $$CATALOG_NAME"
        echo "  Storage: S3"
        echo "  Location: s3a://admin-bucket"
        echo "  S3 UI: http://rustfs-1:9000"
        echo ""
        echo "Root credentials:"
        echo "  Client ID:     $$CLIENT_ID"
        echo "  Client Secret: $$CLIENT_SECRET"
        echo ""
        echo "Polaris main APIs:"
        echo "  - Iceberg REST:   http://${PUBLIC_IP:-localhost}:8181/api/catalog/v1"
        echo "  - Management:     http://${PUBLIC_IP:-localhost}:8181/api/management/v1"
        echo "  - Generic Tables: http://${PUBLIC_IP:-localhost}:8181/api/polaris/v1"
        echo ""
        echo "Polaris admin APIs:"
        echo "  - Health check:   http://localhost:8182/q/health"
        echo "  - Metrics:        http://localhost:8182/q/metrics"
        echo ""
        echo "To get started with Spark:"
        echo "  spark-sql \\"
        echo "    --packages org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.10.1,org.apache.iceberg:iceberg-aws-bundle:1.10.1 \\"
        echo "    --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions \\"
        echo "    --conf spark.sql.catalog.polaris=org.apache.iceberg.spark.SparkCatalog \\"
        echo "    --conf spark.sql.catalog.polaris.type=rest \\"
        echo "    --conf spark.sql.catalog.polaris.warehouse=$$CATALOG_NAME \\"
        echo "    --conf spark.sql.catalog.polaris.uri=http://${PUBLIC_IP:-localhost}:8181/api/catalog \\"
        echo "    --conf spark.sql.catalog.polaris.credential=$$CLIENT_ID:$$CLIENT_SECRET \\"
        echo "    --conf spark.sql.catalog.polaris.scope=PRINCIPAL_ROLE:ALL \\"
        echo "    --conf spark.sql.catalog.polaris.header.X-Iceberg-Access-Delegation=vended-credentials \\"
        echo "    --conf spark.sql.defaultCatalog=polaris"
        echo ""
        echo "Note: With credential vending enabled (X-Iceberg-Access-Delegation=vended-credentials),"
        echo "      Polaris automatically provides temporary S3 credentials, endpoint, region, and"
        echo "      other storage configuration. No explicit storage settings are needed."
        echo ""
        echo "To get started with REST API:"
        echo "  # Get a token"
        echo "  export TOKEN=\$$(curl -s -X POST http://${PUBLIC_IP:-localhost}:8181/api/catalog/v1/oauth/tokens \\"
        echo "    -d 'grant_type=client_credentials' \\"
        echo "    -d 'client_id=$$CLIENT_ID' \\"
        echo "    -d 'client_secret=$$CLIENT_SECRET' \\"
        echo "    -d 'scope=PRINCIPAL_ROLE:ALL' \\"
        echo "    | jq -r '.access_token')"
        echo ""
        echo "  # Create a namespace"
        echo "  curl -X POST http://${PUBLIC_IP:-localhost}:8181/api/catalog/v1/$$CATALOG_NAME/namespaces \\"
        echo "    -H \"Authorization: Bearer \$$TOKEN\" \\"
        echo "    -H 'Content-Type: application/json' \\"
        echo "    -d '{\"namespace\": [\"my_namespace\"], \"properties\": {}}'"
        echo ""
        echo "  # List namespaces"
        echo "  curl -X GET http://${PUBLIC_IP:-localhost}:8181/api/catalog/v1/$$CATALOG_NAME/namespaces \\"
        echo "    -H \"Authorization: Bearer \$$TOKEN\""
        echo ""
        echo "=========================================="
        touch /tmp/polaris-setup-done
        tail -f /dev/null
    init: true
    restart: no
    healthcheck:
      interval: 1s
      timeout: 10s
      retries: 240
      test: [CMD, test, -f, /tmp/polaris-setup-done]
  #  ================================== Polaris UI ========================================== #
  polaris-ui:
    image: docker.io/trivadis/polaris-console:latest
    container_name: polaris-ui
    hostname: polaris-ui
    platform: linux/amd64
    labels:
      com.platys.name: polaris
      com.platys.description: Web UI for Apache Polaris Iceberg REST Catalog
      com.platys.webui.title: Polaris UI
      com.platys.webui.url: http://dataplatform:28494
    ports:
      - 28494:8080
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      VITE_POLARIS_API_URL: http://${PUBLIC_IP}:8181
      VITE_OAUTH_TOKEN_URL: http://${PUBLIC_IP}:8181/api/catalog/v1/oauth/tokens
      VITE_POLARIS_REALM: POLARIS
      VITE_POLARIS_PRINCIPAL_SCOPE: PRINCIPAL_ROLE:ALL
    volumes:
      - ./data-transfer:/data-transfer:z
    restart: unless-stopped
  #  ================================== Nimtabe ========================================== #
  nimtable-web:
    image: ghcr.io/nimtable/nimtable-web:nightly
    container_name: nimtable-web
    hostname: nimtable-web
    labels:
      com.platys.name: nimtable
      com.platys.description: Control Plane for Iceberg
      com.platys.webui.title: Nimtable Web UI
      com.platys.webui.url: http://dataplatform:28463
      com.platys.password.envvars: PLATYS_NIMTABLE_ADMIN_PASSWORD
    depends_on:
      - nimtable
    ports:
      - 28463:3000
    environment:
      - JAVA_API_URL=http://nimtable:8182
      - DATABASE_URL=postgresql://nimtable:abc123!@postgresql:5432/nimtabledb
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=${PLATYS_NIMTABLE_ADMIN_PASSWORD:-abc123!}
    volumes:
      - ./data-transfer:/data-transfer:z
    restart: unless-stopped
  nimtable:
    image: ghcr.io/nimtable/nimtable:nightly
    container_name: nimtable
    hostname: nimtable
    labels:
      com.platys.name: nimtable
      com.platys.description: Control Plane for Iceberg
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - 28464:8182
    environment:
      - JAVA_OPTS=-Xmx32g -Xms512m
      - AWS_ACCESS_KEY_ID=${PLATYS_AWS_ACCESS_KEY:-admin}
      - AWS_SECRET_ACCESS_KEY=${PLATYS_AWS_SECRET_ACCESS_KEY:-abc123abc123!}
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL_S3=http://rustfs-1:9000
      - AWS_ENDPOINT_URL_STS=http://rustfs-1:9000
    # Mount configuration files
    configs:
      - source: nimtable-config.yaml
        target: /nimtable/config.yaml
    volumes:
      - ./data-transfer:/data-transfer:z
    restart: unless-stopped
  #  ================================== Coder ========================================== #
  coder:
    image: ghcr.io/coder/coder:v2.36.3
    container_name: coder
    hostname: coder
    labels:
      com.platys.name: coder
      com.platys.description: Cloud development environments on your infrastructure
      com.platys.webui.title: Coder UI
      com.platys.webui.url: http://dataplatform:7080
    user: root
    depends_on:
      - postgresql
    ports:
      - 7080:7080
    environment:
      CODER_PG_CONNECTION_URL: postgresql://postgres:abc123!@postgresql/postgres?sslmode=disable
      CODER_HTTP_ADDRESS: 0.0.0.0:7080
      CODER_ACCESS_URL: http://${PUBLIC_IP:-dataplatform}:7080
    volumes:
      - ./data-transfer:/data-transfer:z
      - /var/run/docker.sock:/var/run/docker.sock:z
    restart: unless-stopped
  #  ================================== Wetty ========================================== #
  wetty:
    image: docker.io/wettyoss/wetty:2
    container_name: wetty
    hostname: wetty
    labels:
      com.platys.name: wetty
      com.platys.description: A terminal window in Web-Browser
      com.platys.webui.title: WeTTY UI
      com.platys.webui.url: http://dataplatform:3001
    ports:
      - 3001:3000
    environment:
      - SSHHOST=${DOCKER_HOST_IP:-localhost}
      - SSHPORT=22
      - SSHUSER=
      - SSHAUTH=password
      - PORT=3000
      - BASE=/
    volumes:
      - ./data-transfer:/data-transfer:z
    restart: unless-stopped
  #  ================================== Forgejo ========================================== #
  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    container_name: forgejo
    hostname: forgejo
    labels:
      com.platys.name: forgejo
      com.platys.description: Lightweight self-hosted Git service
      com.platys.webui.title: Forgejo UI
      com.platys.webui.url: http://dataplatform:3004
    ports:
      - 3004:3000
      - 222:22
    environment:
      - USER_UID=1000
      - USER_GID=1000
    volumes:
      - ./container-volume/forgejo:/data:z
      - ./data-transfer:/data-transfer:z
    restart: unless-stopped
  #  ================================== dbt Workbench ========================================== #
  dbt-workbench-backend:
    image: ghcr.io/rezer-bleede/dbt-workbench-backend:latest
    container_name: dbt-workbench-backend
    hostname: dbt-workbench-backend
    platform: linux/amd64
    labels:
      com.platys.name: dbt-workbench
      com.platys.description: dbt Workbench backend
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - 28496:8000
    environment:
      - AUTH_ENABLED=false
      - POSTGRES_HOST=postgresql
      - POSTGRES_USER=dbt_workbench
      - POSTGRES_PASSWORD=${PLATYS_DBT_WORKBENCH_DB_PASSWORD:-abc123!}
      - POSTGRES_DB=dbt_workbench
      - DBT_ARTIFACTS_PATH=/app/data/artifacts
      - DBT_PROJECT_PATH=/app/data/repos/default
      - BACKEND_PORT=8000
      - SQL_WORKSPACE_DEFAULT_CONNECTION_URL=postgresql://dbt_workbench:${PLATYS_DBT_WORKBENCH_DB_PASSWORD:-abc123!}@postgresql:5432/dbt_workbench
      - AI_ENABLED=false
      - AI_DEFAULT_MODE=direct
      - AI_DEFAULT_DIRECT_PROVIDER=openai
      - AI_DEFAULT_DIRECT_MODEL_OPENAI=
      - AI_DEFAULT_DIRECT_MODEL_ANTHROPIC
      - AI_ALLOW_SESSION_PROVIDER_OVERRIDE=true
      - AI_MCP_LOCAL_ALLOWLIST_JSON={}
    volumes:
      - ./data-transfer:/data-transfer:z
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/health]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  dbt-workbench-frontend:
    image: ghcr.io/rezer-bleede/dbt-workbench-frontend:latest
    container_name: dbt-workbench-frontend
    hostname: dbt-workbench-frontend
    platform: linux/amd64
    labels:
      com.platys.name: dbt-workbench
      com.platys.description: dbt Workbench — web-based IDE for dbt projects
      com.platys.webui.title: dbt Workbench UI
      com.platys.webui.url: http://dataplatform:28497
    depends_on:
      dbt-workbench-backend:
        condition: service_healthy
    ports:
      - 28497:3000
    environment:
      - VITE_API_BASE_URL=http://${PUBLIC_IP:-dataplatform}:28496
    entrypoint:
      - /bin/sh
      - -c
      - |
        find /app/dist -name '*.js' -exec sed -i "s|http://localhost:8000|$$VITE_API_BASE_URL|g" {} \;
        exec serve -s dist -l 3000
    volumes:
      - ./data-transfer:/data-transfer:z
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:3000]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  #  ================================== markdown-viewer ========================================== #
  markdown-viewer:
    image: docker.io/dannyben/madness:1.2.5
    container_name: markdown-viewer
    hostname: markdown-viewer
    labels:
      com.platys.name: markdown-viewer
      com.platys.description: Platys Platform homepage viewer
      com.platys.webui.title: Markdown Viewer UI
      com.platys.webui.url: http://dataplatform:80
    ports:
      - 80:3000
    volumes:
      - ./artefacts:/docs
      - ./conf/markdown-viewer/markdown-madness.yml:/docs/.madness.yml:z
      - ./data-transfer:/data-transfer:z
    command: server
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, curl -f http://markdown-viewer:3000 || exit 1]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 1m
  markdown-renderer:
    image: docker.io/trivadis/jinja2-renderer:0.8.1
    container_name: markdown-renderer
    hostname: markdown-renderer
    labels:
      com.platys.name: markdown-renderer
      com.platys.description: Platys Platform homepage rendering
    environment:
      USE_PUBLIC_IP: 'True'
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      DOCKER_HOST_IP: ${DOCKER_HOST_IP:-localhost}
      DATAPLATFORM_HOME: ${DATAPLATFORM_HOME}
      PLATYS_PLATFORM_NAME: platys-platform
      PLATYS_PLATFORM_STACK: trivadis/platys-modern-data-platform
      PLATYS_PLATFORM_STACK_VERSION: develop
      PLATYS_COPY_COOKBOOK_DATA: 'True'
      PLATYS_DATACENTER:
      SERVICE_LIST_VERSION: 2
    volumes:
      - ./artefacts/templates:/templates:z
      - ./artefacts/templates:/scripts:z
      - .:/variables:z
      - ./artefacts:/output:z
      - ./data-transfer:/data-transfer:z
    init: true
  #  ================================== data-provisioning ========================================== #
  data-provisioning:
    image: docker.io/trivadis/platys-modern-data-platform-data:latest
    container_name: data-provisioning
    hostname: data-provisioning
    labels:
      com.platys.name: data-provisioning
      com.platys.description: Provisioning sample data
    environment:
      DUMMY: make-it-valid
    volumes:
      - ./data-transfer:/data-transfer:z
    init: true
volumes:
  data-transfer-vol:
    name: data_transfer_vol
  spark-4-1-1-python3-vol:
  spark-4-1-1-python3-java-vol:
configs:
  # Nimtable config file to be mounted into the Docker containers.
  # See backend/config.yaml for more complete example
  nimtable-config.yaml:
    content: |-
      server:
        port: 8182
        host: 0.0.0.0
      database:
        # You can also point to your own Postgres database, instead of using the one provided by docker-compose.
        url: jdbc:postgresql://postgresql:5432/nimtabledb
        username: nimtable
        password: abc123!
