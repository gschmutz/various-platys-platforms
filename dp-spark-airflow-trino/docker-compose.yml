  #  ================================== Apache Hive Metastore ========================================== #
  hive-metastore:
    image: docker.io/trivadis/apache-hive:3.1.2-postgresql-metastore-s3
    container_name: hive-metastore
    hostname: hive-metastore
    labels:
      com.platys.name: hive-metastore
      com.platys.description: Hive Metastore
    depends_on:
      hive-metastore-db:
        condition: service_healthy
    ports:
      - 9083:9083
      - 9084:9084
    environment:
      HIVE_VER: 3.1.2
      JAVA_TOOL_OPTIONS: -Dhive.log.level=INFO
      CORE_CONF_fs_defaultFS: file:///tmp
      HIVE_SITE_CONF_fs_defaultFS: file:///tmp
      HIVE_SITE_CONF_fs_s3a_endpoint: http://rustfs-1:9000
      HIVE_SITE_CONF_fs_s3a_access_key: ${PLATYS_AWS_ACCESS_KEY:-admin}
      HIVE_SITE_CONF_fs_s3a_secret_key: ${PLATYS_AWS_SECRET_ACCESS_KEY:-abc123abc123!}
      HIVE_SITE_CONF_fs_s3a_path_style_access: 'true'
      HIVE_SITE_CONF_fs_s3a_impl: org.apache.hadoop.fs.s3a.S3AFileSystem
      HIVE_SITE_CONF_hive_metastore_uris: thrift://hive-metastore:9083
      HIVE_SITE_CONF_hive_metastore_warehouse_dir: s3a://admin-bucket/warehouse
      HIVE_SITE_CONF_hive_metastore_warehouse_external_dir: s3a://admin-bucket/warehouse/external
      HIVE_SITE_CONF_javax_jdo_option_ConnectionURL: jdbc:postgresql://hive-metastore-db/metastore_db
      HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName: org.postgresql.Driver
      HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName: hive
      HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword: ${PLATYS_HMS_POSTGRESQL_PASSWORD:-abc123!}
      HIVE_SITE_CONF_datanucleus_autoCreateSchema: false
      HIVE_SITE_CONF_hive_metastore_event_db_notification_api_auth: false
      # necessary for Trino to be able to read from Avro
      HIVE_SITE_CONF_metastore_storage_schema_reader_impl: org.apache.hadoop.hive.metastore.SerDeStorageSchemaReader
      SERVICE_PRECONDITION: hive-metastore-db:5432
      DB_DRIVER: postgres
      SERVICE_NAME: metastore
      SERVICE_OPTS: -Xmx1G -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db/metastore_db -Djavax.jdo.option.ConnectionUserName=hive -Djavax.jdo.option.ConnectionPassword=${PLATYS_HMS_POSTGRESQL_PASSWORD:-abc123!}
    volumes:
      - ./data-transfer:/data-transfer:z
    restart: unless-stopped
    healthcheck:
      test: [CMD, nc, -z, hive-metastore, '9083']
      interval: 30s
      timeout: 10s
      retries: 10
  hive-metastore-db:
    image: docker.io/postgres
    container_name: hive-metastore-db
    hostname: hive-metastore-db
    labels:
      com.platys.name: hive-metastore
      com.platys.description: Hive Metastore DB
      com.platys.password.envvars: PLATYS_HMS_POSTGRESQL_PASSWORD
    ports:
      - 5442:5432
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${PLATYS_HMS_POSTGRESQL_PASSWORD:-abc123!}
    volumes:
      - ./data-transfer:/data-transfer:z
    restart: unless-stopped
    healthcheck:
      test: [CMD, psql, -U, hive, metastore_db]
  #  ================================== Airflow ========================================== #
  airflow-apiserver:
    image: docker.io/apache/airflow:3.1.6-python3.10
    container_name: airflow-apiserver
    hostname: airflow-apiserver
    labels:
      com.platys.name: airflow
      com.platys.description: Job Orchestration & Scheduler
      com.platys.webui.title: Airflow UI
      com.platys.webui.url: http://dataplatform:28139
      com.platys.restapi.title: Airflow REST API (apiserver)
      com.platys.restapi.url: http://dataplatform:28139/api/v2/version
      com.platys.password.envvars: PLATYS_AIRFLOW_ADMIN_PASSWORD,PLATYS_AIRFLOW_FERNET_KEY,PLATYS_AIRFLOW_SECRET_KEY,PLATYS_AIRFLOW_JWT_SECRET
    depends_on:
      airflow-init:
        condition: service_completed_successfully
        required: true
      airflow-db:
        condition: service_healthy
    command:
      - api-server
    ports:
      - 28139:8080
    environment:
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      # provide a health service on port 8974
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: true
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${PLATYS_AIRFLOW_POSTGRESQL_PASSWORD:-abc123!}@airflow-db/airflowdb
      # For backward compatibility, with Airflow <2.3
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${PLATYS_AIRFLOW_POSTGRESQL_PASSWORD:-abc123!}@airflow-db/airflowdb
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${PLATYS_AIRFLOW_POSTGRESQL_PASSWORD:-abc123!}@airflow-db/airflowdb
      AIRFLOW__CELERY__BROKER_URL: redis://:@airflow-redis:6379/0
      AIRFLOW__CORE__FERNET_KEY: ${PLATYS_AIRFLOW_FERNET_KEY:-E4H9MUpUWhztG-eO3UTz1YdZt9fRSq5R10eUTPSt8AE=}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${PLATYS_AIRFLOW_SECRET_KEY:-037223d1eda59bb91822f6ea04e892f0}
      AIRFLOW__API_AUTH__JWT_SECRET: ${PLATYS_AIRFLOW_JWT_SECRET:-jUnJ/Vt17d04x0UqHRMRGg==}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: true
      AIRFLOW__CORE__LOAD_EXAMPLES: false
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow[amazon] apache-airflow-providers-apache-spark dlt[airflow] dlt[s3] pyarrow
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 60
      AIRFLOW__CORE__TEST_CONNECTION: Disabled
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
      AIRFLOW__API__EXPOSE_CONFIG: true
      SPARK_HOME: /opt/spark
      JAVA_HOME: /opt/java
      AIRFLOW_VAR_S3_ENDPOINT: http://rustfs-1:9000
      AIRFLOW_VAR_S3_ACCESS_KEY: ${PLATYS_AWS_ACCESS_KEY:-admin}
      AIRFLOW_VAR_S3_SECRET_ACCESS_KEY: ${PLATYS_AWS_SECRET_ACCESS_KEY:-abc123abc123!}
      AIRFLOW_VAR_S3_PATH_STYLE_ACCESS: 'true'
      AIRFLOW__LOGGING__REMOTE_LOGGING: true
      AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: log_s3_conn
      AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: s3://admin-bucket/airflow-logs
      AIRFLOW_CONN_LOG_S3_CONN: >
        { "conn_type": "aws", 
          "host": "rustfs-1", 
          "login": "${PLATYS_AWS_ACCESS_KEY:-admin}", 
          "password": "${PLATYS_AWS_SECRET_ACCESS_KEY:-abc123abc123!}", 
          "schema": "", 
          "port": 9000, 
          "extra": {"endpoint_url": "http://rustfs-1:9000", "region_name": "us-east-1"}
        }
      AWS_ACCESS_KEY_ID: ${PLATYS_AWS_ACCESS_KEY:-admin}
      AWS_SECRET_ACCESS_KEY: ${PLATYS_AWS_SECRET_ACCESS_KEY:-abc123abc123!}
      AIRFLOW__OPENLINEAGE__DISABLED: true
    volumes:
      - ./data-transfer:/data-transfer:z
      - ./scripts/airflow/dags:/opt/airflow/dags:Z
      - ./plugins/airflow/:/opt/airflow/plugins:Z
      - ./scripts/docker/wait-for-it.sh:/usr/src/app/wait-for-it.sh:z
      - spark-4-1-1-python3-vol:/opt/spark:RO
      - spark-4-1-1-python3-java-vol:/opt/java:RO
      - ./container-volume/spark/logs/:/var/log/spark/logs:z
    #  - aws-credentials-vol:/home/airflow/.aws:RO
    user: ${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/api/v2/version]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
